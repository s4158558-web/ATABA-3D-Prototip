<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ATABA 3D Prototip V6 - Tilt + GAZ/FREN</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#87b8d8;font-family:Arial,sans-serif;touch-action:none}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas{display:block;touch-action:none}
#hud{position:fixed;top:12px;left:12px;right:12px;z-index:10;display:flex;justify-content:space-between;pointer-events:none;color:#fff;font-weight:800}
.b{background:#111c;padding:10px 14px;border-radius:14px}
#c{position:fixed;bottom:20px;left:0;right:0;z-index:20;display:flex;justify-content:space-between;padding:0 28px;pointer-events:none}
button{width:120px;height:76px;border:0;border-radius:20px;font-size:22px;font-weight:800;color:#fff;background:#444;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;pointer-events:auto}
button:active{transform:scale(.96);background:#333}
#startBtn{position:fixed;left:50%;top:92px;transform:translateX(-50%);z-index:30;width:auto;height:auto;padding:12px 18px;border:0;border-radius:12px;background:#fff;color:#111;font-size:16px;box-shadow:0 3px 10px #0004}
@media (orientation:portrait){
 body::before{content:"📱 Lütfen tableti yatay çevir";position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#20252b;color:#fff;font:800 24px system-ui;text-align:center;padding:24px;box-sizing:border-box}
}
</style>
</head>
<body>
<div id="hud">
  <div class="b">🚗 ATABA 3D</div>
  <div class="b" id="sp">0 km/h</div>
  <div class="b" id="sensor">DİREKSİYON: BAŞLATILMADI</div>
</div>
<div id="c">
  <button id="f" type="button">FREN</button>
  <button id="g" type="button">GAZ</button>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87b8d8);
scene.fog=new THREE.Fog(0x87b8d8,70,220);

const cam=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,500);
cam.position.set(0,5,10);

const ren=new THREE.WebGLRenderer({antialias:true});
ren.setSize(innerWidth,innerHeight);
ren.setPixelRatio(Math.min(devicePixelRatio,2));
ren.shadowMap.enabled=true;
document.body.appendChild(ren.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x506050,2));
const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(-30,50,20);
scene.add(sun);

function plane(w,d,c){
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d),new THREE.MeshStandardMaterial({color:c}));
  m.rotation.x=-Math.PI/2;
  return m;
}
const grass=plane(500,500,0x55734c);
grass.position.y=-.05;
scene.add(grass);

const road=plane(12,500,0x30343a);
scene.add(road);

for(let z=-240;z<250;z+=12){
  const x=new THREE.Mesh(
    new THREE.BoxGeometry(.2,.03,6),
    new THREE.MeshBasicMaterial({color:0xffffff})
  );
  x.position.set(0,.02,z);
  scene.add(x);
}

function car(c){
  const q=new THREE.Group();
  const m=new THREE.MeshStandardMaterial({color:c,roughness:.6});
  const b=new THREE.Mesh(new THREE.BoxGeometry(2.2,.75,4.1),m);
  b.position.y=.75;
  q.add(b);
  const cab=new THREE.Mesh(
    new THREE.BoxGeometry(1.65,.7,1.9),
    new THREE.MeshStandardMaterial({color:0x263640})
  );
  cab.position.set(0,1.35,-.15);
  q.add(cab);
  return q;
}

const player=car(0x172229);
player.position.z=6;
scene.add(player);

const traffic=[];
for(let i=0;i<7;i++){
  const q=car([0x8b1e1e,0xeee7d0,0x1d4e89,0x555555,0xc47b21][i%5]);
  q.scale.setScalar(.9);
  q.position.set([-4,-1.3,1.3,4][i%4],0,-25-i*30);
  scene.add(q);
  traffic.push(q);
}

const keys={g:false,f:false};

function bindButton(id,key){
  const b=document.getElementById(id);

  const down=e=>{
    e.preventDefault();
    e.stopPropagation();
    keys[key]=true;
    try{b.setPointerCapture(e.pointerId)}catch(_){}
  };
  const up=e=>{
    e.preventDefault();
    e.stopPropagation();
    keys[key]=false;
  };

  b.addEventListener('pointerdown',down,{passive:false});
  b.addEventListener('pointerup',up,{passive:false});
  b.addEventListener('pointercancel',up,{passive:false});
  b.addEventListener('lostpointercapture',up,{passive:false});
  b.addEventListener('contextmenu',e=>e.preventDefault(),{passive:false});
  b.addEventListener('selectstart',e=>e.preventDefault(),{passive:false});
}

bindButton('g','g');
bindButton('f','f');

let speed=0;
let tilt=0;
let filteredTilt=0;
let zeroGamma=null;
let sensorReady=false;
let orientationStarted=false;

const sensorEl=document.getElementById('sensor');
const startBtn=document.createElement('button');
startBtn.id='startBtn';
startBtn.type='button';
startBtn.textContent='🎮 DİREKSİYONU BAŞLAT';
document.body.appendChild(startBtn);

function handleOrientation(e){
  if(typeof e.gamma!=='number' || !Number.isFinite(e.gamma)) return;

  // İlk geçerli ölçümü merkez kabul et.
  if(zeroGamma===null){
    zeroGamma=e.gamma;
    filteredTilt=0;
  }

  // ±30 derece aralığını tam direksiyon aralığına yay.
  const delta=e.gamma-zeroGamma;
  let raw=THREE.MathUtils.clamp(delta/30,-1,1);

  // Küçük sensör titremelerinde araç düz kalsın.
  if(Math.abs(raw)<0.045) raw=0;

  // Daha yumuşak direksiyon.
  filteredTilt=THREE.MathUtils.lerp(filteredTilt,raw,.18);
  tilt=filteredTilt;
  sensorReady=true;

  const pct=Math.round(tilt*100);
  sensorEl.textContent='DİREKSİYON: '+(pct>0?'+':'')+pct+'%';
}

async function startMotion(){
  try{
    if(typeof DeviceOrientationEvent==='undefined'){
      sensorEl.textContent='SENSÖR DESTEKLENMİYOR';
      return;
    }

    if(typeof DeviceOrientationEvent.requestPermission==='function'){
      const r=await DeviceOrientationEvent.requestPermission();
      if(r!=='granted'){
        sensorEl.textContent='SENSÖR İZNİ VERİLMEDİ';
        return;
      }
    }

    zeroGamma=null;
    filteredTilt=0;
    tilt=0;

    addEventListener('deviceorientation',handleOrientation,{passive:true});
    sensorEl.textContent='TABLETİ DÜZ TUT — KALİBRE EDİLİYOR...';

    setTimeout(()=>{
      if(!sensorReady) sensorEl.textContent='SENSÖR VERİSİ YOK';
    },2500);

  }catch(err){
    sensorEl.textContent='SENSÖR BAŞLATILAMADI';
  }
}

startBtn.addEventListener('click',async e=>{
  e.preventDefault();
  await startMotion();
  setTimeout(()=>{
    if(sensorReady) startBtn.remove();
  },700);
});

if(window.isSecureContext){
  sensorEl.textContent='DİREKSİYON HAZIR — BAŞLAT';
}else{
  sensorEl.textContent='HTTPS GEREKLİ';
}

let clock=new THREE.Clock();

function loop(){
  requestAnimationFrame(loop);

  const dt=Math.min(clock.getDelta(),.04);

  if(keys.g) speed=Math.min(1,speed+dt*.7);
  else speed=Math.max(0,speed-dt*.35);

  if(keys.f) speed=Math.max(0,speed-dt*1.8);

  // Direksiyon: sola negatif, sağa pozitif.
  const steerPower=4.5+speed*9;
  player.position.x=THREE.MathUtils.clamp(
    player.position.x+tilt*dt*steerPower,
    -4.7,4.7
  );

  player.rotation.y=THREE.MathUtils.lerp(
    player.rotation.y,
    -tilt*.24,
    Math.min(1,dt*9)
  );

  for(const q of traffic){
    q.position.z+=(12+speed*48)*dt;
    if(q.position.z>20){
      q.position.z=-210-Math.random()*80;
      q.position.x=[-4,-1.3,1.3,4][Math.floor(Math.random()*4)];
    }
  }

  cam.position.x=THREE.MathUtils.lerp(
    cam.position.x,
    player.position.x*.55,
    Math.min(1,dt*4)
  );

  cam.lookAt(player.position.x*.25,1,-8);
  document.getElementById('sp').textContent=Math.round(speed*120)+' km/h';

  ren.render(scene,cam);
}

loop();

addEventListener('resize',()=>{
  cam.aspect=innerWidth/innerHeight;
  cam.updateProjectionMatrix();
  ren.setSize(innerWidth,innerHeight);
});

(async()=>{
  try{
    if(screen.orientation?.lock) await screen.orientation.lock('landscape');
  }catch(_){}
})();
</script>
</body>
</html>
